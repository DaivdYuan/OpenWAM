site_name: Open-WAM
site_description: Unified WAM research framework documentation
site_url: https://daivdyuan.github.io/Open-WAM/
repo_url: https://github.com/DaivdYuan/Open-WAM
repo_name: DaivdYuan/Open-WAM
docs_dir: .docs_site
site_dir: site
theme:
  name: readthedocs
  highlightjs: true
nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: quickstart.md
      - CLI Reference: cli.md
      - Running Experiments: running_experiments.md
  - Concepts:
      - Architecture: architecture.md
      - Method Families: method_families.md
      - Benchmarks And Data: benchmarks.md
  - Reproducibility:
      - Artifacts: artifacts.md
      - Experiment Cards: experiment_cards.md
      - Reproducibility: reproducibility.md
  - Extending:
      - Extension SDK: extension_sdk.md
  - Operations:
      - Testing: testing.md
      - Deployment Namespace: deployment_namespace.md
      - GitHub Pages: github_pages.md
      - Release Process: release.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
validation:
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore
